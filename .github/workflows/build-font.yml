name: Build Maple Mono NL

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/fonts/maple-mono/config.json'
      - '.github/workflows/build-font.yml'
  workflow_dispatch: # 保留手动在 GitHub 页面一键触发兜底

permissions:
  contents: write # 授予推送孤儿分支权限

jobs:
  build:
    name: Build & Package Font Artifacts
    runs-on: ubuntu-latest
    # 仅在官方主仓库运行，防止在外部 Fork 副本中意外触发
    if: github.repository == 'Lokyael/vpsbase'
    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone Upstream Maple Font
        run: |
          git clone --depth 1 -b v7 https://github.com/subframe7536/maple-font _build_maple

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '_build_maple/requirements.txt'

      - name: Install Build Dependencies
        working-directory: _build_maple
        run: |
          pip install -r requirements.txt

      - name: Inject Repository Config
        run: |
          cp scripts/fonts/maple-mono/config.json _build_maple/config.json

      - name: Compile Fonts
        working-directory: _build_maple
        run: |
          python build.py --cn --cn-wenyuan --nf --nf-mono --no-liga --no-hinted --ttf-only --least-styles

      - name: Assemble & Package Artifacts
        run: |
          mkdir -p _dist_pkg
          # 仅收集最终的 NF-CN (Maple Mono NL NFMono CN) 目标字体产物，剔除纯西文等中间产物
          find _build_maple/fonts/ -type f -name "*CN*.ttf" -exec cp {} _dist_pkg/ \;

          TTF_COUNT=$(find _dist_pkg/ -type f -name "*.ttf" | wc -l)
          echo "✨ 成功提取法定基准字体数量: ${TTF_COUNT}"
          if [ "${TTF_COUNT}" -eq 0 ]; then
            echo "❌ 未检索到目标 *CN*.ttf 字体文件！" >&2
            exit 1
          fi

          # 打入配置源文件与说明
          cp scripts/fonts/maple-mono/config.json _dist_pkg/
          cp scripts/fonts/maple-mono/README.md _dist_pkg/

          # 打包为高压缩 zip
          cd _dist_pkg && zip -9 -r ../latest-maple-mono-nl.zip . && cd ..

          # 校验打包产物及体积边界 (防御 GitHub 100MB 硬阻断)
          ZIP_SIZE=$(stat -c%s "latest-maple-mono-nl.zip")
          echo "📦 生成发布归档包: latest-maple-mono-nl.zip (${ZIP_SIZE} bytes)"
          if [ "${ZIP_SIZE}" -gt 104857600 ]; then
            echo "❌ 归档包体积超出 GitHub 单文件 100MB 限制 (${ZIP_SIZE} bytes)！" >&2
            exit 1
          fi

      - name: Force Deploy to Assets Orphan Branch (Zero Release & Zero History Bloat)
        run: |
          # 提取打包产物至独立的临时暂存区，杜绝任何历史污染与工作区状态竞争
          DEPLOY_DIR=$(mktemp -d)
          cp latest-maple-mono-nl.zip "${DEPLOY_DIR}/"

          cd "${DEPLOY_DIR}"
          git init -b assets
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest-maple-mono-nl.zip
          git commit -m "chore: update auto-built Maple Mono NL assets"

          # 显式使用带有令牌授权的上下文强推至 assets 孤儿分支
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if ! git push --force origin assets; then
            echo "❌ 推送至 assets 孤儿分支失败！" >&2
            echo "👉 请排查：" >&2
            echo "   1. 仓库 Settings -> Actions -> General -> Workflow permissions 是否已勾选 'Read and write permissions'" >&2
            echo "   2. 仓库是否配置了分支保护规则或规则集阻断了强制推送" >&2
            exit 1
          fi

          echo "🚀 成功发布最新 Maple Mono NL 等宽字体基线至 assets 孤儿分支！"
